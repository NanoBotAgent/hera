name: Preview comment

# Publishes the media a Preview run filmed and reports on the pull request. Runs in this
# repository after the capture run finishes, so it holds a write token even when the pull
# request came from a fork. The media is untrusted input in the sense that the fork's run
# produced it, but it is rendered (screenshots, one video) rather than executed: it is
# committed to the previews-media branch as-is and embedded in the comment.

on:
  workflow_run:
    workflows: [Preview]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: preview-comment
  cancel-in-progress: false

jobs:
  publish:
    # Cancelled runs are a newer capture taking over; their half-filmed output would only
    # make the comment stale. pull_request covers pushes; workflow_dispatch covers the
    # /preview comment command.
    if: >-
      ${{ (github.event.workflow_run.event == 'pull_request' ||
           github.event.workflow_run.event == 'workflow_dispatch') &&
          github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      HEAD_REPO_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Find the pull request
        id: pr
        run: |
          set -euo pipefail
          # The pull_requests array on the event leaks pull requests from the network of
          # forks (same head commit resolves to the wrong repo's number), so ask this repo
          # which of its pull requests owns the reporting branch instead.
          number="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${HEAD_REPO_OWNER}:${HEAD_BRANCH}&state=open" --jq '.[0].number // ""')"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Fetch the filmed media
        if: env.CONCLUSION == 'success'
        uses: actions/download-artifact@v4
        with:
          name: preview-media
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: media/

      - name: Find the pull request from the marker
        id: pr_marker
        if: steps.pr.outputs.number == '' && env.CONCLUSION == 'success'
        run: |
          set -euo pipefail
          # A capture a /preview comment dispatched ran on the default branch, so the run's
          # own branch does not name the pull request. The capture leaves the number in the
          # artifact (preview.yml, "Note which pull request this is").
          marker="media/pr-number"
          number="$( [ -f "$marker" ] && tr -d ' \n\r' < "$marker" || true)"
          if [ -z "$number" ]; then
            echo "No pull request points at ${HEAD_SHA} and the artifact has no marker; nothing to report on."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/$number" --jq '.state' | grep -qx open || exit 0
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Publish media to the previews branch
        if: (steps.pr.outputs.number || steps.pr_marker.outputs.number) && env.CONCLUSION == 'success'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number || steps.pr_marker.outputs.number }}
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dest="pr-${PR_NUMBER}"
          # The download lives outside the repo so switching branches cannot collide with it.
          mv media /tmp/preview-media-artifact
          # Pull request comments strip <video> tags; a GIF renders inline everywhere. Two
          # passes with a 160-colour palette keep it watchable without exploding the size, and
          # it is cut to 30 seconds so the comment stays well under the embedding limit. The
          # film is recorded at 1080p; 1280 px wide keeps the GIF readable and light.
          video="$(ls /tmp/preview-media-artifact/videos/*.webm 2>/dev/null | head -1 || true)"
          if [ -n "$video" ]; then
            ffmpeg -hide_banner -loglevel error -t 30 -i "$video" \
              -vf "fps=12,scale=1280:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=160[p];[s1][p]paletteuse=dither=bayer" \
              -loop 0 "${video%.webm}.gif"
          fi
          if git ls-remote --exit-code --heads origin previews-media >/dev/null 2>&1; then
            git fetch origin previews-media
            git checkout previews-media
            git reset --hard origin/previews-media
          else
            git checkout --orphan previews-media
            git rm -rf . || true
          fi
          rm -rf "$dest"
          mkdir -p "$dest"
          rm -f /tmp/preview-media-artifact/pr-number
          cp -r /tmp/preview-media-artifact/. "$dest/"
          git add -A
          git commit -m "Preview media for PR #${PR_NUMBER}"
          git push origin previews-media
          if [ -n "$video" ]; then
            echo "PREVIEW_VIDEO=$(basename "$video")" >> "$GITHUB_ENV"
            echo "PREVIEW_GIF=$(basename "${video%.webm}.gif")" >> "$GITHUB_ENV"
          fi

      - name: Write the comment body
        if: steps.pr.outputs.number || steps.pr_marker.outputs.number
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number || steps.pr_marker.outputs.number }}
        run: |
          set -euo pipefail
          if [ "$CONCLUSION" = success ]; then
            base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/previews-media/pr-${PR_NUMBER}"
            {
              echo "### Preview walkthrough"
              echo
              echo "| Start | Waiting (feather) | Waiting (eye) |"
              echo "| --- | --- | --- |"
              echo "| ![]($base/screenshots/01-start.png) | ![]($base/screenshots/02-waiting-feather.png) | ![]($base/screenshots/03-waiting-eye.png) |"
              echo
              echo "| First answer | Long trace (collapsed) | Long trace (open) |"
              echo "| --- | --- | --- |"
              echo "| ![]($base/screenshots/04-first-answer.png) | ![]($base/screenshots/05-long-trace-collapsed.png) | ![]($base/screenshots/06-long-trace-open.png) |"
              echo
              echo "| Phone: start | Phone: answer |"
              echo "| --- | --- |"
              echo "| ![]($base/screenshots/07-start-phone.png) | ![]($base/screenshots/08-answer-phone.png) |"
              if [ -n "${PREVIEW_GIF:-}" ]; then
                echo
                echo "### Video"
                echo
                echo "![Turn walkthrough]($base/videos/${PREVIEW_GIF})"
                echo
                echo "[Full-quality webm]($base/videos/${PREVIEW_VIDEO})"
              fi
            } > comment.md
          else
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}#artifacts"
            echo "Preview capture did not finish; any media that made it is here: $url" > comment.md
          fi

      - name: Post or update the pull request comment
        if: steps.pr.outputs.number || steps.pr_marker.outputs.number
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number || steps.pr_marker.outputs.number }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- preview-walkthrough -->";
            const pr = Number(process.env.PR_NUMBER);
            const body = `${fs.readFileSync("comment.md", "utf8").trim()}\n\n${marker}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }
