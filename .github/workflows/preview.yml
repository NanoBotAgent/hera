name: Preview

# What a change looks like, on the request itself. Builds the real interface, serves it from a
# real server with a scripted model behind it, and walks a browser through the scenes a
# reviewer would walk to -- start page, the waiting mark mid-breath, answers, a long trace,
# the phone -- and attaches screenshots and a video to the run. No live endpoint, nothing
# deployed, everything disposable.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-workspace

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/core/web/package-lock.json

      - name: Build the interface
        working-directory: apps/core/web
        run: npm ci && npm run build

      - name: Install the browser
        run: uv run playwright install chromium --with-deps

      - name: Film the walkthrough
        run: uv run python tests/e2e/capture_preview.py preview-media

      - name: Upload the media
        uses: actions/upload-artifact@v4
        with:
          name: preview-media
          path: preview-media/
          retention-days: 14
          if-no-files-found: error

      - name: Publish media to the previews branch
        if: success()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          staging="$(mktemp -d)"
          cp -r preview-media/. "$staging/"
          rm -rf preview-media
          dest="pr-${PR_NUMBER}"
          if git ls-remote --exit-code --heads origin previews-media >/dev/null 2>&1; then
            git fetch origin previews-media
            git checkout previews-media
            git reset --hard origin/previews-media
          else
            git checkout --orphan previews-media
            git rm -rf . || true
          fi
          # A botched earlier run left the raw capture folder itself tracked on this branch;
          # the per-PR folder is the only thing that should ever live here.
          git rm -rf --ignore-unmatch preview-media
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -r "$staging/." "$dest/"
          git add -A
          git commit -m "Preview media for PR #${PR_NUMBER}"
          git push --force origin previews-media

      - name: Comment the media on the pull request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${{ github.repository }}/previews-media/pr-${PR_NUMBER}"
          {
            echo "### Preview walkthrough"
            echo
            echo "| Start | Waiting (feather) | Waiting (eye) |"
            echo "| --- | --- | --- |"
            echo "| ![]($base/screenshots/01-start.png) | ![]($base/screenshots/02-waiting-feather.png) | ![]($base/screenshots/03-waiting-eye.png) |"
            echo
            echo "| First answer | Long trace (collapsed) | Long trace (open) |"
            echo "| --- | --- | --- |"
            echo "| ![]($base/screenshots/04-first-answer.png) | ![]($base/screenshots/05-long-trace-collapsed.png) | ![]($base/screenshots/06-long-trace-open.png) |"
            echo
            echo "| Phone: start | Phone: answer |"
            echo "| --- | --- |"
            echo "| ![]($base/screenshots/07-start-phone.png) | ![]($base/screenshots/08-answer-phone.png) |"
            echo
            video="$(cd "pr-${PR_NUMBER}/videos" && ls *.webm | head -1)"
            echo "### Video"
            echo
            echo "<video src=\"$base/videos/${video}\" controls muted></video>"
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file comment.md

      - name: Tell the pull request where they are
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { runId } = context;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}#artifacts`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview capture failed; any media that made it is here: ${url}`,
            });
